# Datasource
server.port=8086
spring.datasource.url=jdbc:mysql://localhost:3306/dealer_jwt?createDatabaseIfNotExist=true&useSSL=true
spring.datasource.username=root
spring.datasource.password=Pass@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.generate-ddl=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.main.allow-circular-references=true


# Logging
logging.level.root=INFO
logging.level.com.spring.jwt=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web.socket=DEBUG


# Mail
spring.mail.username=saassa@gmail.com
spring.mail.password=ree
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.auth=true


# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


do.CDN.No=https://carsimages.blr1.digitaloceanspaces.com


# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
app.server.url=http://localhost:8080


# Cloudflare R2
